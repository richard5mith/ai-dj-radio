[project]
name = "ai-dj-radio-radio-server"
version = "0.1.0"
description = "AI-powered streaming radio station server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydub>=0.25.1",
    "mutagen>=1.47.0",
    "pillow>=10.0.0",
    "openai>=1.3.0",
    "requests>=2.31.0",
    "python-multipart>=0.0.6",
    "schedule>=1.2.0",
    "pytz>=2023.3",
    "aiofiles>=23.2.1",
    "python-json-logger>=2.0.7",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "aiohttp>=3.9.0",
    "watchdog>=3.0.0",
]

[project.scripts]
ai-dj-radio-server = "radio_server.cli:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radio_server"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "vulture>=2.10",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "N803",  # argument name should be lowercase (conflicts with common patterns)
    "N806",  # variable in function should be lowercase (conflicts with common patterns)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py files
